name: CI/CD — ALL Detection System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:         # allows manual trigger from GitHub UI

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE:   ghcr.io/${{ github.repository_owner }}/all-detection

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & static analysis
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy types-PyYAML

      - name: Ruff (format + lint)
        run: |
          ruff format --check src/ app/ tests/
          ruff check  src/ app/ tests/

      - name: Mypy (type checking)
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # non-blocking for now; enforce after full type annotation


  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_training_pipeline.py \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -p no:warnings

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false


  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Docker build
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build & scan
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format:    sarif
          output:    trivy-results.sarif
          severity:  CRITICAL,HIGH

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name != 'pull_request'
        with:
          sarif_file: trivy-results.sarif


  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy to Hugging Face Spaces (main branch only)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-hf:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history for git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install HF Hub CLI
        run: pip install huggingface_hub[cli]

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}   # e.g. "username/all-detection"
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api   = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]

          # Upload all source files (excludes data/ and checkpoints/)
          api.upload_folder(
              folder_path   = ".",
              repo_id       = space,
              repo_type     = "space",
              ignore_patterns = [
                  "data/**", "models/checkpoints/**", "logs/**",
                  ".git/**", ".github/**", "notebooks/**",
                  "**/__pycache__/**", "**/*.pyc",
              ],
              commit_message = "CI: deploy from GitHub Actions",
          )
          print(f"✔  Deployed to https://huggingface.co/spaces/{space}")
          EOF


  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Create GitHub release artefacts
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish release tarball
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Package source (excluding data / checkpoints)
        run: |
          tar -czf all-detection-source-${{ github.event.release.tag_name }}.tar.gz \
              --exclude='./data' \
              --exclude='./models/checkpoints' \
              --exclude='./logs' \
              --exclude='./.git' \
              --exclude='./notebooks' \
              .

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: all-detection-source-*.tar.gz
