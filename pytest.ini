[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths   = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    --color=yes

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    gpu:  marks tests that require a CUDA GPU
    integration: marks end-to-end integration tests

# ── Coverage (optional — requires pytest-cov) ─────────────────────────────────
# addopts = --cov=src --cov-report=term-missing --cov-report=html

# ── Min version ───────────────────────────────────────────────────────────────
minversion = 7.0

# ── Timeout (requires pytest-timeout) ────────────────────────────────────────
# timeout = 120
